name: Navigation candidate screenshots
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  screenshots:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Build the exact candidate
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          npm ci --ignore-scripts --no-audit --no-fund
          npm run prepare:math
          python3 scripts/assemble_frontier.py
          python3 scripts/reports.py
          python3 scripts/build_previews.py
      - name: Capture candidate in preinstalled Chrome
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/navigation_screenshots.py --dist dist --output navigation-screenshots
      - name: Preserve screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-screenshots-${{ github.event.pull_request.head.sha }}
          path: |
            navigation-screenshots/*.png
            navigation-screenshots/receipt.json
          if-no-files-found: error
          retention-days: 7
