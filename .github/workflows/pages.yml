name: Publish GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Test and build trusted main
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run prepare:math
          python3 scripts/assemble_frontier.py
          python3 scripts/reports.py
          python3 -m unittest discover -s tests -v
          node tests/test_hero_atlas.cjs
          node tests/test_brief_reader.cjs
          node tests/test_reader_controls.cjs
          python3 scripts/build.py
          node --test tests/test_map_core.cjs tests/test_map_dom.cjs tests/test_catalog_facets.cjs tests/test_atlas_hierarchy.cjs
          node --test tests/atlas-preview/relations.test.cjs tests/test_radar_controls.cjs
          python3 scripts/validate.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated static output
        id: deployment
        uses: actions/deploy-pages@v4
